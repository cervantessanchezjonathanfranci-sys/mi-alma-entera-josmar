<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Veces Te Amo - mi budín ✨</title>
    
    <!-- Fuentes Kawaii de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --amarillo-pompom: #fff3a1;
            --amarillo-pastel: #fffbe3;
            --marron-boina: #5c3a21;
            --marron-suave: #8c5a32;
            --blanco-crema: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            color: var(--marron-boina);
            background-color: var(--amarillo-pompom);
            overflow-x: hidden;
        }

        /* Fondo de patrón Pompompurin con overlay */
        .pompom-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff6bd;
            background-image: 
                radial-gradient(var(--marron-boina) 10%, transparent 11%),
                radial-gradient(var(--marron-boina) 10%, transparent 11%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.15;
            z-index: -2;
        }

        header {
            padding: 60px 20px 30px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 4.5rem;
            color: var(--marron-boina);
            text-shadow: 4px 4px 0px #ffffff;
            margin: 0;
        }

        .subtitle {
            font-size: 1.3rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--marron-suave);
            margin-top: 10px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto 50px auto;
            background: var(--amarillo-pastel);
            padding: 35px;
            border-radius: 35px;
            border: 5px solid var(--marron-boina);
            box-shadow: 0 10px 0px var(--marron-suave);
        }

        /* Cuadrícula de idiomas */
        .languages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lang-card {
            background: var(--blanco-crema);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid var(--marron-boina);
            box-shadow: 0 4px 0px var(--marron-boina);
            transition: all 0.2s ease;
        }

        .lang-card:hover {
            transform: translateY(-4px);
            background: #fff8d6;
            box-shadow: 0 6px 0px var(--marron-boina);
        }

        .lang-name {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--marron-suave);
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .phrase {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            display: block;
            color: var(--marron-boina);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 20px 20px 60px 20px;
        }

        .btn {
            text-decoration: none;
            color: var(--marron-boina);
            background: var(--blanco-crema);
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0px var(--marron-boina);
            border: 3px solid var(--marron-boina);
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #fff8d6;
            color: var(--marron-boina);
            box-shadow: 0 7px 0px var(--marron-boina);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px var(--marron-boina);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-weight: 700;
            color: var(--amarillo-pastel);
            background: var(--marron-boina);
        }

        /* Elementos Flotantes */
        .floating-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: floatUp var(--duration) linear infinite;
            z-index: -1;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .languages-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .phrase { font-size: 1rem; }
            .container { padding: 20px; margin: 0 15px 40px 15px; }
        }
    </style>
</head>
<body>

    <div class="nav-buttons">

        <a href="juego1.html" class="btn">Carrera</a>
